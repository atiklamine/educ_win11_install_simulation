<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#163866"/>
      <stop offset="45%" stop-color="#0e2142"/>
      <stop offset="85%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    
    <radialGradient id="bloomBackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal Gradients -->
    <!-- Center Main Petal (Royal Blue to Cyan) -->
    <linearGradient id="petalCenter" x1="20%" y1="90%" x2="70%" y2="10%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Left Wing Petal (Electric Indigo to Violet) -->
    <linearGradient id="petalLeft1" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Wing Petal (Vibrant Purple to Magenta / Cyan edge) -->
    <linearGradient id="petalRight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Top Petal Fold (Soft Rose to Periwinkle) -->
    <linearGradient id="petalTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Deep Shadow Folds -->
    <linearGradient id="shadowFold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1"/>
    </linearGradient>
    
    <linearGradient id="shadowFold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Soft ambient filter for outer bloom aura -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Wallpaper Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Ambient Light Sphere behind Bloom -->
  <circle cx="960" cy="540" r="550" fill="url(#bloomBackGlow)"/>

  <!-- CENTRAL WINDOWS 11 BLOOM GEOMETRY -->
  <g transform="translate(960, 530)">
    
    <!-- Layer 0: Back Droop Petals (Darker Indigo / Purple base) -->
    <path d="M-220,180 C-340,140 -440,-20 -380,-140 C-320,-260 -180,-240 -80,-180 C-140,-100 -200,60 -220,180 Z" 
          fill="#312e81" opacity="0.75" />
    <path d="M220,190 C350,150 460,0 400,-130 C340,-250 200,-230 90,-170 C150,-90 200,70 220,190 Z" 
          fill="#1e1b4b" opacity="0.7" />

    <!-- Layer 1: Left Wing Ribbon (Curving Upwards & Inwards) -->
    <path d="M-260,160 C-380,80 -480,-110 -360,-220 C-260,-310 -110,-260 -30,-160 C-120,-160 -220,-80 -230,50 C-235,90 -250,130 -260,160 Z" 
          fill="url(#petalLeft1)"/>

    <!-- Shadow between left ribbon and center -->
    <path d="M-230,50 C-210,-40 -120,-130 -30,-160 C-80,-120 -150,0 -160,80 Z" 
          fill="url(#shadowFold1)"/>

    <!-- Layer 2: Right Wing Ribbon (Flowing Arc towards top-right) -->
    <path d="M250,170 C360,90 460,-90 350,-210 C250,-300 120,-260 40,-160 C120,-150 220,-70 230,60 C235,100 245,140 250,170 Z" 
          fill="url(#petalRight1)"/>

    <!-- Layer 3: Central Billow - Back Arch (Magenta/Lavender crest) -->
    <path d="M-140,-110 C-160,-280 -40,-350 80,-340 C190,-330 250,-240 200,-130 C150,-220 30,-260 -40,-240 C-90,-220 -130,-170 -140,-110 Z" 
          fill="url(#petalTop)"/>

    <!-- Layer 4: Main Front Center Petal (Sculpted Cyan-Blue Wave) -->
    <path d="M-150,120 C-180,-10 -90,-140 10,-170 C110,-200 210,-140 220,30 C225,120 120,220 -20,230 C-90,235 -135,180 -150,120 Z" 
          fill="url(#petalCenter)"/>

    <!-- Layer 5: Front Inner Sculpting & Depth Creases -->
    <path d="M-90,140 C-110,30 -40,-80 40,-100 C110,-120 170,-50 160,50 C140,-20 80,-70 20,-60 C-40,-50 -80,40 -90,140 Z" 
          fill="#38bdf8" opacity="0.9"/>

    <path d="M-60,170 C-10,180 50,170 110,120 C70,140 10,145 -30,135 C-50,130 -58,150 -60,170 Z" 
          fill="#bae6fd" opacity="0.8"/>

    <!-- Ambient Shadow Fold on Base -->
    <path d="M-150,120 C-60,170 40,175 140,100 C70,125 -30,120 -100,85 Z" 
          fill="url(#shadowFold2)"/>
  </g>
</svg>
